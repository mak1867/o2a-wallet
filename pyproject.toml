[project]
name = "o2a-wallet"
version = "0.3.0"
description = "A local MCP wallet that holds verified O2A sponsored offers and exchanges them for promo codes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ivaylo Maksimov", email = "215309870+mak1867@users.noreply.github.com" }]
requires-python = ">=3.12"
keywords = ["mcp", "o2a", "offers", "ai-agents", "wallet", "ed25519"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "o2a-protocol[http] @ git+https://github.com/mak1867/o2a@v0.5.0",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://o2a.exchange"
Repository = "https://github.com/mak1867/o2a-wallet"
Issues = "https://github.com/mak1867/o2a-wallet/issues"
"Format spec" = "https://github.com/mak1867/o2a/blob/main/docs/o2a-format-v0.md"

[project.scripts]
o2a-wallet-mcp = "o2a_wallet.mcp_server:main"
o2a-wallet = "o2a_wallet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["o2a_wallet"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
strict = true
files = ["o2a_wallet", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
